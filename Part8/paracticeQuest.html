<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>
    body{
        background-color: rgb(61, 244, 140);
        color: white;
    }
</style>
<body>
     <!-- Add the following elements to the container using only js and dom methods.
 1. a <p> with red text that says "Hey I'm red".
 2. an <h3> with blue text that says "I'm a blue h3!".
 3. a <div> with a black border and pink background color with the foll ele inside of it.
 * another <h1> thst says "I'm in a div".
 * a <p> that says "Me Too!". -->


<script>
    console.log("hello to console");

let bodyy =document.querySelector('body');
let container = document.createElement('div');
bodyy.append(container);
container.style.backgroundColor="yellow";

let p = document.createElement('p');
p.innerText="Hey I'm red";
p.style.color="red";
container.appendChild(p);

let h3 = document.createElement('h3');
h3.innerText="Hey I'm blue h3!";
h3.style.color="blue";
container.appendChild(h3);

let div = document.createElement('div');
div.style.border=" 2px solid black";
div.style.backgroundColor="pink";
document.querySelector("body").append(div);

let h1 = document.createElement('h1');
h1.innerText="I'm in a div";
h1.style.color="grey";
div.appendChild(h1);

let divpara = document.createElement('p');
divpara.innerText="Me Too!";
divpara.style.color="purple";
div.appendChild(divpara);











</script>



</body>
</html>
