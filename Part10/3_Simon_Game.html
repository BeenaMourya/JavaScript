<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body {
    text-align: center;
    background-color: bisque;
  }

  #red {
    background-color: #d91f00;
    border: 5px solid pink;
  }

  #green {
    background-color: #33a300;
    border: 5px solid pink;

  }

  #blue {
    background-color: #2e2ee3;
    border: 5px solid pink;

  }

  #orange {
    background-color: #ff6300;
    border: 5px solid pink;

  }

  .Flash {
    background-color: white !important;

    /* Since each button has a strong background-color set in the #red, #green, #blue, #orange styles, the .Flash class needs !important to override it temporarily. */

  }

  .userFlash {
    background-color: black !important;
  }



  .div_container {
    display: flex;
    justify-content: center;
    height: 450px;
    width: 640px;
    border: 10px solid rgb(242, 210, 210);
    padding: 50px;
    margin-left: 450px;
    background-color: black;
  }

  .Btn_Color {
    /* border: 1px solid black; */
    border-radius: 600px;
    height: 200px;
    width: 300px;
    /* margin: 20px; */
    margin: 2rem;
  }
</style>

<body>

  <h1>Simon Says Game</h1>
  <h2>Press any key to start the game</h2>
  <h2 id="HighScore"> Higest Score : 0 </h2>

  <div class="div_container">
    <div class="line-one">

      <div class="Btn_Color" id="red" type="button">red</div>
      <div class="Btn_Color" id="green" type="button">green</div>
    </div>
    <div class="line-one">
      <div class="Btn_Color" id="blue" type="button">blue</div>
      <div class="Btn_Color" id="orange" type="button">orange</div>
    </div>

  </div>


  <script>
    let GameSequence = [];
    let userSeq = [];

    let HighScore = localStorage.getItem('highScore') || 0; // retrieves stored data. in browser loacal storage//return null  key doesn’t exist, || 0 as default value
    //.....  localStorage.getItem(key)      Purpose: Retrieves the value associated with a given key from the browser's local storage.
    let btns = ['orange', 'green', 'blue', 'red'];
    let Level = 0;
    let GameStarted = false;
    let h2 = document.querySelector('h2');
    let body = document.querySelector('body');
    document.getElementById('HighScore').innerText = `Highest Score: ${HighScore}`;

    body.addEventListener('keypress', function () {
      // console.log("button press");
      if (GameStarted == false) { // or  => !GameStarted
        console.log("..........Game is started...........");
        GameStarted = true;
        levelup();

      }
    })



    function gameFlash(btn) {
      btn.classList.add('Flash');
      // console.log(".....Flashing button:......", btn.id);
      setTimeout(function () {
        btn.classList.remove('Flash');
        // console.log("Flash removed:", btn.id);
      }, 250);
    }
    // setTimeout(() => {
    //         btn.classList.remove('Flash');
    //     }, 300);

    // ----------------------------------------

    function userFlash(btn) {
      btn.classList.add('userFlash');
      // console.log(".....Flashing button:......", btn.id);
      setTimeout(function () {
        btn.classList.remove('userFlash');
        // console.log("Flash removed:", btn.id);
      }, 250);
    }

    // ----------------------------------------
    function levelup() {
      userSeq = []; //refreshing the game seq to null/from start to enter each btn from start to complete the level
      Level++;
      h2.innerText = `Level ${Level}`;

      let randomIndx = Math.floor(Math.random() * 4);
      let randomColor = btns[randomIndx];
      let randomBtn = document.getElementById(randomColor);
      // let randomBtn =document.getElementById(`.${randomColor}`); //...if   color was the class
      // console.log(randomIndx);
      // console.log(randomColor);
      // console.log(randomBtn);
      GameSequence.push(randomColor);
      console.log(GameSequence);



      gameFlash(randomBtn);


    }
    // ------------------------------------------


    function CheckUserBtn(indx) { //checks the last added button is equal to gameseq
      console.log("current level :", Level);

      // let indx = Level-1;

      //Level 1: -> Level = 1 -> userSeq.length = 1 (User clicks one button) -> indx = Level - 1 = 0  -> We compare userSeq[0] with GameSequence[0]. 
      //Level 2: -> Level = 2  -> userSeq.length = 2 (User clicks two buttons) indx = Level - 1 = 1We compare userSeq[1] with GameSequence[1]

      if (userSeq[indx] === GameSequence[indx]) {
        // console.log('same values');
        if (userSeq.length == GameSequence.length) {
          //Suppose the game is at Level 3, and the sequence generated by the game is: [ "red", "blue", "green" ]
          //  The player clicks red → The game checks, but userSeq.length (1) != GameSequence.length (3), so nothing happens.
          //  The player clicks blue → Still not equal.
          //  The player clicks green → Now userSeq.length == GameSequence.length (3 == 3), so the game waits 1 second and then moves to the next level. 
          setTimeout(levelup, 1000);
        }
      }

      else {
        h2.innerHTML = `Game Over! Your score was <b>${Level}</b> <br>Press any key to start`;
        document.querySelector('body').style.backgroundColor = 'red';
        setTimeout(function () {
          document.querySelector('body').style.backgroundColor = 'white';
        }, 150);

        gameHighestScore();

        
        Reset();
      }

    }

    function gameHighestScore() {
          if (Level > HighScore) {
            HighScore = Level;
            localStorage.setItem('highScore', HighScore);
            //..... localStorage.setItem(key, value)     Purpose: Stores a value associated with a specific key in the browser's local storage. localStorage.setItem("key", "value");
            document.getElementById('HighScore').innerText = `Highest Score: ${HighScore}`;

          }
        }
    // ----------------------------------------
    let user_btnPress = function () {
      // console.log('btn was pressed',this);
      let butto = this;//butto now holds a reference to the clicked button (<button id="red">).
      //................this refers to the button that was clicked
      userFlash(butto);
      userColor = butto.getAttribute('id');
      // console.log('id is :', userColor); // btn enter by user

      userSeq.push(userColor);

      CheckUserBtn(userSeq.length - 1);//last indx of user input btn
    }

    let allBtns = document.querySelectorAll('.Btn_Color');
    for (bt of allBtns) {
      bt.addEventListener('click', user_btnPress);
    }


    // -------------------------------

    function Reset() {
      GameStarted = false;
      GameSequence = [];
      userSeq = [];
      Level = 0;
    }

    // -------------------------------



  </script>
</body>

</html>
